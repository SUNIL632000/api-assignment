# ==========================================================
# Appium / Device Configuration
# Edit these values to match your local emulator, physical
# device, or cloud (BrowserStack) setup.
# ==========================================================

# Appium server URL (default when running `appium` locally)
appium.server.url=http://127.0.0.1:4723

# Device capabilities
platformName=Android
platformVersion=14
deviceName=emulator-5554
automationName=UiAutomator2

# Google Calculator app (pre-installed on Android emulator images with Google APIs).
# If your emulator/device ships the AOSP calculator instead, switch to:
#   appPackage=com.android.calculator2
#   appActivity=com.android.calculator2.Calculator
appPackage=com.google.android.calculator
appActivity=com.android.calculator2.Calculator

# Don't reinstall/reset app state between sessions
noReset=true

# Implicit/explicit wait timeout (seconds)
explicitWaitSeconds=15

# Screenshot directory (relative to project root)
screenshotDir=screenshots
